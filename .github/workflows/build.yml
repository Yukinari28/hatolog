name: Build Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use the deployed app as the offline fallback
        shell: bash
        run: cp server/public/index.html electron/index.html

      - name: Install Electron app dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows EXE
        working-directory: electron
        run: npm run dist

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            electron/dist/*.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Use the deployed app as the offline fallback
        run: cp server/public/index.html android-project/www/index.html

      - name: Install app dependencies
        working-directory: android-project
        run: npm install

      - name: Add Android platform
        working-directory: android-project
        run: npx cap add android

      - name: Add the Google sign-in deep link to AndroidManifest.xml
        working-directory: android-project
        run: node patch-android-manifest.js

      - name: Generate app icon and splash screen
        working-directory: android-project
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into the Android project
        working-directory: android-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to HatoLog.apk
        run: cp android-project/android/app/build/outputs/apk/debug/app-debug.apk android-project/android/app/build/outputs/apk/debug/HatoLog.apk

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: HatoLog-apk
          path: android-project/android/app/build/outputs/apk/debug/HatoLog.apk
          if-no-files-found: error
