<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — HatoLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6EF; --surface:#FFFFFF; --text:#243024; --text-muted:#5C6B57;
    --border:#D6E0CB; --accent:#E1774E; --accent-strong:#C55E39; --bad:#BE5450;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141C15; --surface:#1B241C; --text:#E9F1E3; --text-muted:#A3B49B;
      --border:#33422F; --accent:#EE8F63; --accent-strong:#F4A67D; --bad:#E58884;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:"Figtree",ui-sans-serif,system-ui,sans-serif;
    padding:24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:32px 28px; max-width:380px; width:100%; text-align:center;
    box-shadow:0 6px 24px -8px rgba(36,48,36,0.25);
  }
  h1{ font-family:"Baloo 2",ui-rounded,system-ui,sans-serif; font-size:1.25rem; margin:0 0 6px; }
  p{ color:var(--text-muted); line-height:1.55; font-size:0.92rem; margin:0 0 22px; }
  button{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:11px 20px; font-size:0.95rem; font-weight:600;
    font-family:inherit; cursor:pointer; width:100%;
  }
  button:hover{ border-color:var(--accent); }
  button:disabled{ opacity:0.6; cursor:default; }
  .status{ margin-top:18px; font-size:0.85rem; color:var(--text-muted); min-height:1.2em; }
  .status.error{ color:var(--bad); }
  .heart{ font-size:1.6rem; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💚</div>
    <h1>Sign in to HatoLog</h1>
    <p id="intro">Sign in with the Google account you want to use in the app. Once you're done, you'll be sent back automatically.</p>
    <button type="button" id="signin-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="status" id="status"></div>
  </div>

<script type="module">
"use strict";

// Same project config as index.html's FIREBASE_CONFIG — keep these two in sync.
var FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

var params = new URLSearchParams(window.location.search);
var platform = params.get("platform") || "app";
var appNames = { windows: "the Windows app", android: "the Android app" };
document.getElementById("intro").textContent =
  "Sign in with the Google account you want to use in " + (appNames[platform] || "the app") +
  ". Once you're done, you'll be sent back there automatically.";

var btn = document.getElementById("signin-btn");
var statusEl = document.getElementById("status");

function setStatus(msg, isError){
  statusEl.textContent = msg;
  statusEl.className = "status" + (isError ? " error" : "");
}

if(!FIREBASE_CONFIG.apiKey){
  btn.disabled = true;
  setStatus("This sign-in page hasn't been configured yet — FIREBASE_CONFIG is still empty in auth-bridge.html.", true);
}else{
  btn.addEventListener("click", async function(){
    btn.disabled = true;
    setStatus("Opening the Google sign-in window…");
    try{
      var mods = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js")
      ]);
      var app = mods[0].initializeApp(FIREBASE_CONFIG);
      var auth = mods[1].getAuth(app);
      var provider = new mods[1].GoogleAuthProvider();
      var result = await mods[1].signInWithPopup(auth, provider);
      var cred = mods[1].GoogleAuthProvider.credentialFromResult(result);
      if(!cred || !cred.idToken){ throw new Error("Didn't get a usable credential back from Google."); }
      setStatus("Signed in — sending you back to the app…");
      var back = "hatolog://authcallback?idToken=" + encodeURIComponent(cred.idToken) + "&platform=" + encodeURIComponent(platform);
      window.location.href = back;
      setTimeout(function(){
        setStatus("If nothing happened, you can close this tab and reopen the app — it should already be signed in.");
      }, 2500);
    }catch(e){
      btn.disabled = false;
      setStatus("Sign-in didn't go through: " + (e && e.message ? e.message : e), true);
    }
  });
}
</script>
</body>
</html>
